{% load static %}

<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apps4U - Add Material</title>

    <link rel="icon" type="image/ico" href="{% static 'images/favicon.ico' %}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Russo+One&family=SN+Pro:ital,wght@0,200..900;1,200..900&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        body { font-family: 'SN Pro', sans-serif; }
        .font-logo {font-family: 'Russo One', sans-serif;}
    </style>
</head>
<body class="min-h-screen flex flex-col bg-white">

    <header class="bg-[#6B5B95] text-white h-16 py-2 px-6 md:px-12 flex items-center justify-between fixed top-0 left-0 w-full z-50">
        <div class="text-3xl tracking-wide font-logo flex-shrink-0">
            <a href="{% url 'home' %}">Apps4U</a>
        </div>

        <div class="flex items-center space-x-4">
            <nav class="hidden md:flex space-x-2">
                <a href="{% url 'course_list' %}"
                class="px-4 py-2 text-sm rounded-lg transition-all duration-200 bg-white text-[#6B5B95] font-bold">
                Курси
                </a>

                <a href="{% url 'faq_list' %}" class="px-3 py-1.5 text-sm hover:text-gray-200 transition">FAQs</a>
                <a href="#" class="px-3 py-1.5 text-sm hover:text-gray-200 transition">Петиції</a>
                <a href="{% url 'starter_pack' %}" class="px-3 py-1.5 text-sm hover:text-gray-200 transition">Стартерпак</a>
            </nav>

            <a href="{% url 'profile' %}" class="group flex items-center">
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-white group-hover:border-[#E0E8D0] transition-colors duration-300">
                    <img src="{{ user.profile.icon.url }}" alt="Profile Picture" class="w-full h-full object-cover">
                </div>
            </a>
        </div>
    </header>

    <div class="flex-grow pt-16 flex flex-col md:flex-row">

        <aside class="w-full md:w-[320px] bg-[#E4EACD] flex-shrink-0 p-8 flex flex-col gap-6">
            <div class="flex items-center gap-3 font-semibold text-gray-900 mt-4 md:mt-8">
                <i data-lucide="info" class="w-5 h-5"></i>
                <span class="text-xl">Контент</span>
            </div>

            <nav class="flex flex-col gap-2 mt-4">
                <a href="{% url 'course_detail' activity.course.slug %}" class="text-[#4A4A4A] hover:bg-white/60 px-4 py-3 rounded-xl text-[16px] transition">
                    Про Курс
                </a>

                <a href="{% url 'course_activities' activity.course.slug %}" class="bg-white text-black px-4 py-3 rounded-xl text-[16px]">
                    Активності
                </a>
                <a href="{% url 'course_faq' activity.course.slug %}" class="text-[#4A4A4A] hover:bg-white/60 px-4 py-3 rounded-xl text-[16px] transition">
                    Поширені запитання
                </a>

                <div class="mt-8 border-t border-black pt-6">
                    <a href="{% url 'course_list' %}" class="text-[#4A4A4A] hover:text-black text-[16px] flex items-center gap-2 transition">
                        <i data-lucide="arrow-left" class="w-4 h-4"></i> Назад до курсів
                    </a>
                </div>
            </nav>
        </aside>

        <main class="w-full p-6 md:p-12 flex justify-center">

            <div class="w-full max-w-2xl bg-white rounded-3xl shadow-sm border border-gray-100 p-8 h-fit mt-4 md:mt-8">

                <h2 class="text-2xl md:text-3xl font-bold text-gray-800 mb-8 border-b border-gray-100 pb-4">
                    Додати матеріал для <span class="text-[#6B5B95]">{{ activity.activity_text }}</span>
                </h2>

                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}

                    <div class="space-y-5
                                [&>p]:flex [&>p]:flex-col [&>p]:gap-2
                                [&_label]:text-sm [&_label]:font-semibold [&_label]:text-gray-700
                                [&_input]:w-full [&_input]:border [&_input]:border-gray-200 [&_input]:rounded-xl [&_input]:px-4 [&_input]:py-3 [&_input]:bg-gray-50 [&_input]:focus:bg-white [&_input]:focus:ring-2 [&_input]:focus:ring-[#6B5B95]/50 [&_input]:focus:border-[#6B5B95] [&_input]:outline-none [&_input]:transition-all
                                [&_textarea]:w-full [&_textarea]:border [&_textarea]:border-gray-200 [&_textarea]:rounded-xl [&_textarea]:px-4 [&_textarea]:py-3 [&_textarea]:bg-gray-50 [&_textarea]:focus:bg-white [&_textarea]:focus:ring-2 [&_textarea]:focus:ring-[#6B5B95]/50 [&_textarea]:focus:border-[#6B5B95] [&_textarea]:outline-none [&_textarea]:transition-all
                                [&_select]:w-full [&_select]:border [&_select]:border-gray-200 [&_select]:rounded-xl [&_select]:px-4 [&_select]:py-3 [&_select]:bg-gray-50 [&_select]:focus:bg-white [&_select]:focus:ring-2 [&_select]:focus:ring-[#6B5B95]/50 [&_select]:focus:border-[#6B5B95] [&_select]:outline-none [&_select]:transition-all
                                [&_.helptext]:text-xs [&_.helptext]:text-gray-500 [&_.helptext]:mt-1">
                        {{ form.as_p }}
                    </div>

                    <div class="flex items-center justify-end gap-4 mt-10 pt-6 border-t border-gray-100">

                        <a href="{% url 'activity_detail' activity.course.slug activity.id %}"
                        class="text-sm font-medium text-gray-500 hover:text-red-500 transition-colors px-2 py-2">
                            Скасувати
                        </a>

                        <button type="submit"
                                class="flex items-center gap-2 bg-[#6B5B95] hover:bg-[#5a4c7e] text-white px-6 py-2.5 rounded-xl font-semibold transition-all shadow-md hover:shadow-lg transform hover:-translate-y-0.5 active:translate-y-0 active:scale-95">
                            Зберегти
                            <i data-lucide="save" class="w-4 h-4 ml-1"></i>
                        </button>

                    </div>
                </form>

            </div>
        </main>

    </div>

    <script>
        lucide.createIcons();
    </script>

<footer class="bg-[#EADDFF] pt-12 pb-32 px-6 md:px-20">
</footer>
