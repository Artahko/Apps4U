{% extends "base.html" %}

{% load static %}

{% block title %}Apps4U - Редагування Профілю{% endblock %}

{% block content %}

<div class="min-h-[80vh] flex items-center justify-center bg-white px-4 py-12 pt-24">
    <div class="bg-[#E3EBCF] p-8 md:p-12 rounded-3xl shadow-xl max-w-2xl w-full border border-gray-100">

        <div class="flex items-center justify-between mb-10">
            <h2 class="text-3xl font-logo text-black">Редагувати профіль</h2>
            <a href="{% url 'profile' %}" class="text-gray-400 hover:text-gray-600 transition">
                <i data-lucide="x" class="w-6 h-6"></i>
            </a>
        </div>

        <form method="POST" enctype="multipart/form-data" class="space-y-6">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="flex flex-col items-center mb-8">
                <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-white mb-4 shadow-sm">
                    <img id="image-preview" src="{{ user.profile.icon.url }}" alt="Current Profile" class="w-full h-full object-cover">
                </div>
                <label class="cursor-pointer bg-gray-50 px-4 py-2 rounded-lg border border-gray-200 text-sm font-medium hover:bg-gray-100 transition">
                    Змінити фото
                    <input type="file" name="icon" class="hidden" id="id_icon">
                </label>
            </div>

            <div>
                <label class="block text-xs font-bold text-black uppercase tracking-widest mb-2 ml-1">Про себе</label>
                {{ p_form.about }}
            </div>

            <div class="flex space-x-4 pt-6">
                <button type="submit" class="flex-1 bg-[#6B5B95] text-white py-3 rounded-xl font-bold shadow-lg hover:bg-[#5a4d7d] transition transform active:scale-95">
                    Зберегти зміни
                </button>
                <a href="{% url 'profile' %}" class="flex-1 bg-white text-center py-3 border border-gray-200 rounded-xl font-medium text-black-500 hover:bg-gray-50 transition">
                    Скасувати
                </a>
            </div>
        </form>
    </div>
</div>

<style>
    textarea {
        width: 100%;
        padding: 0.75rem;
        background-color: white;
        border: 1px solid #E5E7EB;
        border-radius: 0.75rem;
        min-height: 10px;
        outline: none;
    }
</style>

<script>
    const fileInput = document.getElementById('id_icon');
    const imagePreview = document.getElementById('image-preview');

    fileInput.onchange = evt => {
        const [file] = fileInput.files;
        if (file) {
            imagePreview.src = URL.createObjectURL(file);
        }
    }
</script>

{% endblock %}
